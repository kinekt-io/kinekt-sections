name: Publish private package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@kinekt-io'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build && pnpm check && pnpm build:example && pnpm build:catalog
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify private visibility
        run: |
          VISIBILITY=$(gh api /orgs/kinekt-io/packages/npm/components --jq .visibility)
          test "$VISIBILITY" = private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify registry installation
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ASTRO_VERSION=$(node -p "require('./package.json').devDependencies.astro")
          PAYLOAD_VERSION=$(node -p "require('./package.json').devDependencies.payload")
          CONSUMER=$(mktemp -d "$RUNNER_TEMP/package-consumer.XXXXXX")
          cd "$CONSUMER"
          npm init -y
          npm install --ignore-scripts "$NAME@$VERSION" "astro@$ASTRO_VERSION" "payload@$PAYLOAD_VERSION"
          node "$GITHUB_WORKSPACE/scripts/verify-package.mjs" "$CONSUMER"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
